name: Apply payment integrity patch

on:
  push:
    branches:
      - fix/card-surcharge-accounting-2026-09-23
    paths:
      - .github/workflows/payment-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/card-surcharge-accounting-2026-09-23
          fetch-depth: 0

      - name: Apply atomic payment client patch
        run: node scripts/apply-payment-integrity-patch.mjs

      - name: Verify expected safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "append_invoice_payment" index.html
          grep -q "p_expected_row_version" index.html
          grep -q "id: newId()" index.html
          git diff --check

      - name: Commit patched application
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make invoice payment recording atomic and idempotent"
          git push origin HEAD:fix/card-surcharge-accounting-2026-09-23
