<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZfix Team Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#17181a;--orange:#f7941d;--orange2:#e07800;--paper:#f6f4f0;--card:#fff;--ink:#1a1a1a;--muted:#77736d;--line:#e2ded7;--good:#237a45;--bad:#b3261e;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14px}.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 12px #0003}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#201400;font-weight:900}.top h1{font-size:18px;margin:0}.sub{font-size:11px;color:#b9b6b0}.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 60px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px;font:700 13px Manrope;cursor:pointer}.btn:hover{border-color:#aaa}.btn-primary{background:var(--orange);border-color:var(--orange2);color:#201400}.btn-danger{color:var(--bad)}.btn:disabled{opacity:.55;cursor:not-allowed}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 12px #0000000a}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-head h2{font-size:15px;margin:0}.panel-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.card:hover{border-color:var(--orange)}.name{font-weight:800;font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:800;background:#eee;margin-right:4px}.good{background:#e4f4ea;color:var(--good)}.warn{background:#fff1d8;color:#8a5c00}.bad{background:#fbe7e5;color:var(--bad)}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field span{font-size:11.5px;font-weight:800;color:#5d5953}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font:500 13px Manrope;color:var(--ink)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;font-size:12px}.check input{width:auto}.empty{text-align:center;color:var(--muted);padding:38px 16px}.overlay{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}.modal{width:min(720px,100%);background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0007}.modal-head,.modal-foot{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.modal-body{padding:16px}.auth{max-width:420px;margin:9vh auto}.note{font-size:12px;color:var(--muted);line-height:1.55}.statusline{padding:10px 12px;border-radius:8px;background:#f0eee9;margin-bottom:14px;font-size:12px}.hide{display:none!important}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.row,.checks{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:14px 10px 50px}}
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="mark">EZ</div><div><h1>Team Management</h1><div class="sub">EZfix Garage Doors Inc · secure user accounts</div></div></div><div><button class="btn" onclick="location.href='/'">CRM</button> <button id="signOutBtn" class="btn hide" onclick="signOut()">Sign out</button></div></div>
<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<div id="overlay" class="overlay"><div class="modal"><div class="modal-head"><b id="modalTitle">Team member</b><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button id="saveBtn" class="btn btn-primary" onclick="saveMember()">Save</button></div></div></div>
<script>
const SUPABASE_URL='https://fylbalenuqpovwncwbah.supabase.co';
const SUPABASE_KEY='sb_publishable_Z7x_Vq2PDHAdxwpPElxE-A_qCv3iusF';
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true}});
let caller=null, members=[], editing=null;
const NOTIFY=[['newLead','New Lead Assigned'],['newJob','New Job Assigned'],['scheduleChange','Job Schedule Changed'],['jobCancelled','Job Cancelled'],['customerMessage','Customer Message'],['estimateApproved','Estimate Approved'],['paymentReceived','Payment Received'],['ownerMessage','Owner/Dispatcher Message']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
function toast(msg,bad=false){let e=document.createElement('div');e.textContent=msg;e.style.cssText=`position:fixed;right:16px;bottom:16px;z-index:200;background:${bad?'#b3261e':'#17181a'};color:#fff;padding:11px 14px;border-radius:9px;box-shadow:0 6px 24px #0004;font:700 12px Manrope`;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session)return renderAuth();const {data:u}=await SB.auth.getUser();if(!u?.user)return renderAuth();const {data:m,error}=await SB.from('team').select('id,name,email,role,status').eq('auth_user_id',u.user.id).eq('status','active').maybeSingle();if(error||!m||!['owner','admin'].includes(m.role)){return document.getElementById('app').innerHTML=`<div class="panel auth"><div class="panel-body"><h2>Access restricted</h2><p class="note">Team account management is available only to an active Owner or Admin account.</p><button class="btn" onclick="location.href='/'">Back to CRM</button></div></div>`}caller=m;document.getElementById('signOutBtn').classList.remove('hide');await loadMembers()}
function renderAuth(){document.getElementById('signOutBtn').classList.add('hide');document.getElementById('app').innerHTML=`<div class="panel auth"><div class="panel-head"><h2>Sign in</h2></div><div class="panel-body"><label class="field"><span>Email</span><input id="loginEmail" type="email" autocomplete="email" value="office@ezfixgaragedoorsinc.com"></label><label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label><div id="loginError" class="note" style="color:var(--bad);min-height:18px"></div><button class="btn btn-primary" onclick="login()">Sign in</button></div></div>`}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;const {error}=await SB.auth.signInWithPassword({email,password});if(error){document.getElementById('loginError').textContent=error.message;return}boot()}
async function signOut(){await SB.auth.signOut();caller=null;members=[];renderAuth()}
async function loadMembers(){const {data,error}=await SB.from('team').select('*').order('name');if(error)return toast(error.message,true);members=data||[];renderList()}
function accountBadge(m){return m.auth_user_id?'<span class="badge good">Login linked</span>':'<span class="badge warn">No login</span>'}
function statusBadge(s){return `<span class="badge ${s==='active'?'good':s==='inactive'?'bad':'warn'}">${esc(label(s))}</span>`}
function renderList(){const active=members.filter(m=>m.status==='active').length,linked=members.filter(m=>m.auth_user_id).length;document.getElementById('app').innerHTML=`<div class="toolbar"><button class="btn btn-primary" onclick="openMember()">+ Add team member</button><button class="btn" onclick="loadMembers()">Refresh</button><span class="note">${members.length} team members · ${active} active · ${linked} login accounts linked</span></div><div class="panel"><div class="panel-head"><h2>Technicians & staff</h2><span class="note">Signed in as ${esc(caller.name)} · ${esc(label(caller.role))}</span></div><div class="panel-body">${members.length?`<div class="grid">${members.map(m=>`<div class="card" onclick="openMember('${m.id}')"><div class="name">${esc(m.name)}</div><div style="margin-top:7px">${statusBadge(m.status)}<span class="badge">${esc(label(m.role))}</span>${accountBadge(m)}</div><div class="meta">${esc(m.phone||'No phone')}<br>${esc(m.email||'No email')}${m.app_data?.whatsappNumber?`<br>WhatsApp: ${esc(m.app_data.whatsappNumber)}`:''}</div></div>`).join('')}</div>`:'<div class="empty">No team members yet.</div>'}</div></div>`}
function roleOptions(m){let roles=caller.role==='owner'?['owner','admin','dispatcher','technician']:['admin','dispatcher','technician'];if(m?.role==='owner'&&!roles.includes('owner'))roles.unshift('owner');return roles.map(r=>`<option value="${r}" ${m?.role===r?'selected':''}>${label(r)}</option>`).join('')}
function openMember(id){const m=id?members.find(x=>x.id===id):null;if(m&&caller.role==='admin'&&m.role==='owner')return toast('Admins cannot edit an Owner account.',true);editing=m||null;const app=m?.app_data||{},prefs=app.notifyPrefs||{};document.getElementById('modalTitle').textContent=m?'Edit team member':'Add team member';document.getElementById('modalBody').innerHTML=`<div class="row"><label class="field"><span>Name *</span><input id="f_name" value="${esc(m?.name||'')}"></label><label class="field"><span>Role</span><select id="f_role">${roleOptions(m)}</select></label></div><div class="row"><label class="field"><span>Phone</span><input id="f_phone" type="tel" value="${esc(m?.phone||'')}"></label><label class="field"><span>Email</span><input id="f_email" type="email" value="${esc(m?.email||'')}"></label></div><div class="row"><label class="field"><span>Status</span><select id="f_status"><option value="active" ${m?.status==='active'?'selected':''}>Active</option><option value="inactive" ${m?.status==='inactive'?'selected':''}>Inactive</option><option value="on leave" ${m?.status==='on leave'?'selected':''}>On Leave</option></select></label><label class="field"><span>Default commission %</span><input id="f_commission" type="number" min="0" max="100" step="0.1" value="${m?.commission_percent??''}"></label></div><label class="field"><span>WhatsApp number</span><input id="f_whatsapp" type="tel" value="${esc(app.whatsappNumber||'')}"></label><div class="field"><span>Notification preferences</span><div class="checks">${NOTIFY.map(([k,t])=>`<label class="check"><input type="checkbox" class="notify" data-key="${k}" ${prefs[k]!==false?'checked':''}>${esc(t)}</label>`).join('')}</div></div>${m?`<div class="statusline"><b>Login account:</b> ${m.auth_user_id?'Linked to Supabase Auth':'Not linked yet'}${m.email?` · ${esc(m.email)}`:''}</div><div class="toolbar"><button type="button" class="btn ${m.auth_user_id?'':'btn-primary'}" onclick="inviteAccount('${m.id}')" ${m.auth_user_id?'disabled':''}>${m.auth_user_id?'✓ Login linked':'Invite / Link login account'}</button><button type="button" class="btn" onclick="checkAccount('${m.id}')">Check account</button>${m.status==='active'?`<button type="button" class="btn btn-danger" onclick="quickDeactivate('${m.id}')">Deactivate</button>`:`<button type="button" class="btn" onclick="quickReactivate('${m.id}')">Reactivate</button>`}</div><p class="note">Deactivated users immediately lose CRM data access because database policies require an active Team record. Historical jobs and payroll remain intact.</p>`:'<p class="note">Create the team member first. Then reopen the record to send a secure login invite.</p>'}`;document.getElementById('overlay').style.display='flex'}
function closeModal(){document.getElementById('overlay').style.display='none';editing=null}
async function saveMember(){const name=document.getElementById('f_name').value.trim();if(!name)return toast('Name is required',true);const email=document.getElementById('f_email').value.trim(),phone=document.getElementById('f_phone').value.trim(),role=document.getElementById('f_role').value,status=document.getElementById('f_status').value,commission=Number(document.getElementById('f_commission').value||0),whatsapp=document.getElementById('f_whatsapp').value.trim();const prefs={};document.querySelectorAll('.notify').forEach(x=>prefs[x.dataset.key]=x.checked);const old=editing?.app_data||{};const app_data={...old,whatsappNumber:whatsapp,notifyPrefs:prefs};document.getElementById('saveBtn').disabled=true;try{if(editing){const {error}=await SB.from('team').update({name,email:email||null,phone:phone||null,role,status,commission_percent:commission,app_data,updated_at:new Date().toISOString()}).eq('id',editing.id);if(error)throw error;toast('Team member updated')}else{const id=crypto.randomUUID();const {error}=await SB.from('team').insert({id,name,email:email||null,phone:phone||null,role,status,commission_percent:commission,app_data});if(error)throw error;toast('Team member added')}closeModal();await loadMembers()}catch(e){toast(e.message||'Save failed',true)}finally{document.getElementById('saveBtn').disabled=false}}
async function callAccount(action,teamId){const {data:{session}}=await SB.auth.getSession();if(!session)throw new Error('Sign in required');const r=await fetch(`${SUPABASE_URL}/functions/v1/invite-team-user`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({action,teamId,redirectTo:`${location.origin}/set-password`})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Account action failed (${r.status})`);return d}
async function inviteAccount(id){if(!confirm('Send a secure EZfix CRM login invite to this team member?'))return;try{const d=await callAccount('invite',id);if(d.linkedExisting)toast('Existing login found and linked.');else if(d.alreadyLinked)toast('This account is already linked.');else toast('Secure login invite sent.');await loadMembers();const m=members.find(x=>x.id===id);if(m)openMember(id)}catch(e){toast(e.message||'Invite failed',true)}}
async function checkAccount(id){try{const d=await callAccount('status',id);toast(d.linked?(d.emailConfirmedAt?'Login linked and email confirmed.':'Login linked; invite acceptance is still pending.'):'No login is linked yet.')}catch(e){toast(e.message||'Unable to check account',true)}}
async function quickDeactivate(id){if(!confirm('Deactivate this user? They will immediately lose CRM data access, but history stays intact.'))return;const {error}=await SB.from('team').update({status:'inactive',updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,true);toast('Team member deactivated');closeModal();loadMembers()}
async function quickReactivate(id){const {error}=await SB.from('team').update({status:'active',updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,true);toast('Team member reactivated');closeModal();loadMembers()}
SB.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script>
</body>
</html>
