<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set EZfix CRM Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#f6f4f0;color:#1a1a1a;font-family:Manrope,system-ui,sans-serif}.wrap{max-width:440px;margin:10vh auto;padding:16px}.card{background:#fff;border:1px solid #e2ded7;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #00000012}.head{background:#17181a;color:#fff;padding:18px}.head h1{margin:0;font-size:19px}.body{padding:18px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field span{font-size:12px;font-weight:800}.field input{padding:11px;border:1px solid #ddd7cf;border-radius:8px;font:500 14px Manrope}.btn{width:100%;border:1px solid #e07800;background:#f7941d;color:#201400;border-radius:8px;padding:11px;font:800 14px Manrope;cursor:pointer}.note{color:#77736d;font-size:12px;line-height:1.55}.err{color:#b3261e;font-size:12px;min-height:18px;margin-bottom:8px}.ok{color:#237a45;font-weight:800}</style>
</head>
<body><div class="wrap"><div class="card"><div class="head"><h1>EZfix CRM Account Setup</h1></div><div class="body" id="body"><p class="note">Opening your secure invitation…</p></div></div></div>
<script>
const SB=supabase.createClient('https://fylbalenuqpovwncwbah.supabase.co','sb_publishable_Z7x_Vq2PDHAdxwpPElxE-A_qCv3iusF',{auth:{detectSessionInUrl:true,persistSession:true}});
async function init(){await new Promise(r=>setTimeout(r,250));const {data:{session},error}=await SB.auth.getSession();const body=document.getElementById('body');if(error||!session){body.innerHTML='<p class="err">This invitation link is invalid or expired.</p><p class="note">Ask the EZfix owner/admin to send a new login invite.</p>';return}body.innerHTML=`<p class="note">Your account is verified. Create the password you will use to sign in to EZfix CRM.</p><label class="field"><span>New password</span><input id="p1" type="password" autocomplete="new-password" minlength="8"></label><label class="field"><span>Confirm password</span><input id="p2" type="password" autocomplete="new-password" minlength="8" onkeydown="if(event.key==='Enter')save()"></label><div id="err" class="err"></div><button class="btn" onclick="save()">Set password & open CRM</button>`}
async function save(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,err=document.getElementById('err');err.textContent='';if(p1.length<8){err.textContent='Use at least 8 characters.';return}if(p1!==p2){err.textContent='Passwords do not match.';return}const {error}=await SB.auth.updateUser({password:p1});if(error){err.textContent=error.message;return}document.getElementById('body').innerHTML='<p class="ok">Password saved.</p><p class="note">Opening EZfix CRM…</p>';setTimeout(()=>location.href='/',700)}
init();
</script></body></html>
